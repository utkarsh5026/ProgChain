version: 2
updates:
  # Maintain dependencies for npm (client)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"

  # Maintain dependencies for pip/poetry (server)
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
